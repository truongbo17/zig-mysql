name: Tests

on:
  push:
  pull_request:

# Superseded commits should not consume runner time or MySQL images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: python3 -m unittest discover -s integration -p 'test_*.py'
      - run: zig build test
      - run: bash integration/run.sh
