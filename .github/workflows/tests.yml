name: Tests

on:
  push:
  pull_request:

jobs:
  zig:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig build test
      - run: bash integration/run.sh
