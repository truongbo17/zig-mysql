name: D3 candidate SSL thread-state regression (nonproduction)
on:
  push:
    branches:
      - candidate/d3-openssl-thread-local-cleanup
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-tls-ccu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Disposable MySQL 8.4 verified TLS
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-thread-stop-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-thread-stop-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-thread-stop-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-thread-stop-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Build optimized bounded verified TLS binary
        run: zig build -Doptimize=ReleaseFast
      - name: Require 30 independent pool32/128-borrower verified-TLS process exits
        shell: bash
        run: |
          set -euo pipefail
          export MALLOC_CHECK_=3
          for n in $(seq 1 30); do
            echo "D3_THREAD_STOP_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-bench
            echo "D3_THREAD_STOP_PASS zig=${{ matrix.zig }} repeat=$n"
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f d3-thread-stop-mysql || true
          rm -f /tmp/zig-mysql-test-ca.pem
