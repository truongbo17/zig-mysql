name: D3 Zig checked allocator TLS isolation (diagnostic)

on:
  push:
    branches:
      - diagnostic/d3-zig-safe-allocator-stress
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Start disposable MySQL 8.4 verified TLS fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-checked-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-checked-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-checked-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-checked-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Start disposable MySQL 8.0 plaintext negative-control fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-checked-plain \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33306:3306 mysql:8.0.46
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-checked-plain 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-checked-plain mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec -e MYSQL_PWD=zig_mysql_test d3-checked-plain mysql -uroot -e \
            "CREATE USER 'zigtest'@'%' IDENTIFIED WITH mysql_native_password BY 'zig_mysql_test'; GRANT ALL ON zigtest.* TO 'zigtest'@'%';"
      - name: Compile fully bounded TLS stress with version-native checked allocator
        run: zig build -Doptimize=ReleaseSafe
      - name: Run 12 independent 128-worker TLS CCU matrices with strict corruption detection
        shell: bash
        run: |
          set -euo pipefail
          export MALLOC_CHECK_=3
          export GLIBC_TUNABLES=glibc.malloc.check=3
          plain_failed=0
          for n in $(seq 1 6); do
            echo "D3_CHECKED_PLAIN_START zig=${{ matrix.zig }} repeat=$n"
            if ! timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-plain-checked; then
              echo "D3_CHECKED_PLAIN_CONTROL_FAILURE invalidates TLS-specific attribution" >&2
              plain_failed=1
              break
            fi
            echo "D3_CHECKED_PLAIN_PASS zig=${{ matrix.zig }} repeat=$n"
          done
          for n in $(seq 1 40); do
            echo "D3_CHECKED_TLS_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-checked
            echo "D3_CHECKED_TLS_PASS zig=${{ matrix.zig }} repeat=$n"
          done
          if [[ "$plain_failed" != 0 ]]; then echo "Plain control also failed" >&2; exit 1; fi
      - name: Compare optimized ReleaseFast with identical checked allocator and 40 TLS processes
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast
          export MALLOC_CHECK_=3
          for n in $(seq 1 40); do
            echo "D3_CHECKED_FAST_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-checked
            echo "D3_CHECKED_FAST_PASS zig=${{ matrix.zig }} repeat=$n"
          done
      - name: Cleanup MySQL and test CA
        if: always()
        shell: bash
        run: |
          docker rm -f d3-checked-mysql d3-checked-plain || true
          rm -f /tmp/zig-mysql-test-ca.pem


  owned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Start isolated MySQL 8.4 TLS for owned-Io teardown classification
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-owned-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-owned-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-owned-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-owned-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Build explicit std.Io.Threaded lifecycle control
        run: zig build -Doptimize=ReleaseSafe
      - name: Reproduce native teardown fault with explicit IO lifecycle markers
        shell: bash
        run: |
          set -euo pipefail
          export MALLOC_CHECK_=3
          for n in $(seq 1 35); do
            echo "D3_OWNED_TLS_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-owned-checked
            echo "D3_OWNED_TLS_PASS zig=${{ matrix.zig }} repeat=$n"
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f d3-owned-mysql || true
          rm -f /tmp/zig-mysql-test-ca.pem


  minimal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Start isolated MySQL 8.4 TLS for Minimal entrypoint teardown classification
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-minimal-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-minimal-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-minimal-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-minimal-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Build Minimal entrypoint lifetime control
        run: zig build -Doptimize=ReleaseSafe
      - name: Reproduce native teardown fault with Minimal std.process.Init lifecycle markers
        shell: bash
        run: |
          set -euo pipefail
          export MALLOC_CHECK_=3
          for n in $(seq 1 35); do
            echo "D3_MINIMAL_TLS_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-minimal-checked
            echo "D3_MINIMAL_TLS_PASS zig=${{ matrix.zig }} repeat=$n"
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f d3-minimal-mysql || true
          rm -f /tmp/zig-mysql-test-ca.pem


  explicit-openssl-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.16.0', '0.17.0']
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Start isolated MySQL 8.4 TLS for explicit OpenSSL cleanup teardown classification
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-cleanup-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-cleanup-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-cleanup-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-cleanup-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Build explicit OpenSSL cleanup lifetime control
        run: zig build -Doptimize=ReleaseSafe
      - name: Reproduce native teardown fault with Minimal std.process.Init lifecycle markers
        shell: bash
        run: |
          set -euo pipefail
          export MALLOC_CHECK_=3
          for n in $(seq 1 35); do
            echo "D3_CLEANUP_TLS_START zig=${{ matrix.zig }} repeat=$n"
            timeout 180s python3 bench/profile_runner.py ./zig-out/bin/zig-mysql-high-ccu-tls-minimal-cleanup
            echo "D3_CLEANUP_TLS_PASS zig=${{ matrix.zig }} repeat=$n"
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f d3-cleanup-mysql || true
          rm -f /tmp/zig-mysql-test-ca.pem


  gdb-native-backtrace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Install native debugger and glibc symbols
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gdb libc6-dbg
      - name: Start MySQL 8.4 for native process-exit debugger
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d3-gdb-mysql \
            -e MYSQL_ROOT_PASSWORD=zig_mysql_test -e MYSQL_DATABASE=zigtest \
            -p 127.0.0.1:33307:3306 mysql:8.4.11
          ready=0
          for n in $(seq 1 90); do
            if docker logs d3-gdb-mysql 2>&1 | grep -q 'MySQL init process done. Ready for start up.' && \
               docker exec -e MYSQL_PWD=zig_mysql_test d3-gdb-mysql mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker cp d3-gdb-mysql:/var/lib/mysql/ca.pem /tmp/zig-mysql-test-ca.pem
      - name: Build checked native TLS for symbolic backtrace
        run: zig build -Doptimize=ReleaseSafe
      - name: GDB until SIGSEGV/abort or 18 complete verified-TLS 128-CCU runs
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          for n in $(seq 1 18); do
            echo "D3_GDB_START repeat=$n"
            set +e
            timeout 180s gdb -q -batch -return-child-result \
              -ex 'set debuginfod enabled off' \
              -ex 'set pagination off' \
              -ex 'handle SIGPIPE nostop noprint pass' \
              -ex run -ex 'thread apply all bt 30' \
              --args ./zig-out/bin/zig-mysql-high-ccu-tls-minimal-checked > "$output" 2>&1
            status=$?
            set -e
            if [[ "$status" != 0 ]] || grep -E -q 'Program received signal SIG(SEGV|ABRT)|double free or corruption|free\(\): invalid' "$output"; then
              echo "D3_GDB_CRASH_TRACE code=$status repeat=$n"
              tail -n 160 "$output"
              exit 1
            fi
            echo "D3_GDB_PASS repeat=$n"
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f d3-gdb-mysql || true
          rm -f /tmp/zig-mysql-test-ca.pem
